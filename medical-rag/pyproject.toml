[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag"
version = "0.1.0"
description = "Bilingual (Vietnamese-English) medical RAG with hybrid retrieval, built for LLM inference benchmarking"
readme = "README.md"
requires-python = ">=3.11"
# torch is installed separately so the CUDA build can be chosen (see README).
dependencies = [
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "pyvi>=0.1.1",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["httpx>=0.27", "beautifulsoup4>=4.12", "markdownify>=0.12"]
eval = ["pandas>=2.1"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "respx>=0.21", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs downloaded models (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# long prompt strings and test literals read better unwrapped
ignore = ["E501"]
