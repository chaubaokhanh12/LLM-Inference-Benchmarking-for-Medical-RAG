experiment: E2
backend: vllm
config_name: vllm_fp16
base_url: http://localhost:8000/v1
model: qwen2.5-7b
quantization: fp16
server_command: vllm serve Qwen/Qwen2.5-7B-Instruct --served-model-name qwen2.5-7b --max-model-len 4096 --gpu-memory-utilization 0.90 --port 8000 --no-enable-prefix-caching
metrics_url: http://localhost:8000/metrics
concurrency:
- 1
- 4
- 8
- 16
- 32
repeats: 3
num_prompts: 160
warmup_requests: 10
max_tokens: 256
temperature: 0
prompts: ../prompts/medical_rag_prompts.jsonl
tokenizer: Qwen/Qwen2.5-7B-Instruct
timeout_s: 300
seed: 0
max_duration_s: 300
