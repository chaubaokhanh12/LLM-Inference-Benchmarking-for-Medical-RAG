experiment: E4
backend: vllm
config_name: vllm_fp16_prefix_on
base_url: http://localhost:8000/v1
model: qwen2.5-7b
quantization: fp16
server_command: env VLLM_SERVER_DEV_MODE=1 vllm serve Qwen/Qwen2.5-7B-Instruct --served-model-name qwen2.5-7b --max-model-len 4096 --gpu-memory-utilization 0.90 --port 8000 --enable-prefix-caching
metrics_url: http://localhost:8000/metrics
reset_prefix_cache_url: http://localhost:8000/reset_prefix_cache
concurrency:
- 16
repeats: 3
num_prompts: 160
warmup_requests: 10
max_tokens: 256
temperature: 0
prompts: ../prompts/medical_rag_prompts.jsonl
tokenizer: Qwen/Qwen2.5-7B-Instruct
timeout_s: 300
seed: 0
max_duration_s: 600
