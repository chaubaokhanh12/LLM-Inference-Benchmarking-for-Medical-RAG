[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-bench"
version = "0.1.0"
description = "Serving benchmark (HF Transformers, vLLM, Ollama, TGI) on a real medical RAG workload"
requires-python = ">=3.10"
# Run from this directory: python -m bench.run configs/<experiment>.yaml
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "transformers>=4.44",  # token counting fallback, HF baseline server
    "openai>=1.40",        # LLM judge for quality_eval
]

[project.optional-dependencies]
hf = ["torch>=2.3", "fastapi>=0.110", "uvicorn>=0.29", "accelerate>=0.30"]
dev = ["pytest>=8.0"]

# Only the code packages; colab/, configs/, results/ and tests/ are data or tooling.
[tool.setuptools.packages.find]
include = ["bench*", "servers*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
